<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none" role="img" aria-label="Nexus Desk">
  <title>Nexus Desk</title>
  <style>
    .stroke { stroke: #0f2a44; }
