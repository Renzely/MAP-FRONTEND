    <line class="stroke" x1="0" y1="0" x2="19" y2="11" stroke-width="2"/>
    <line class="stroke" x1="0" y1="0" x2="-19" y2="11" stroke-width="2"/>
    <circle class="fill" cx="0" cy="-22" r="4"/>
    <circle class="fill" cx="19" cy="11" r="4"/>
